<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Off Track</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: rgb(19, 19, 19);
      color: #eee;
      font-family: "Segoe UI", "Montserrat", "Arial", sans-serif;
    }

    body,
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .svg-box {
      width: 320px;
      height: 200px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 2px 12px #21020267;
      text-align: center;
    }

    .error-code {
      color: #AC0707;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1.2px;
      margin-bottom: 10px;
      min-height: 20px;
      text-align: center;
    }

    .desc {
      font-size: 17px;
      color: #ddd;
      margin-bottom: 15px;
      text-align: center;
      letter-spacing: 0.2px;
    }

    .tip {
      font-size: 13px;
      margin-bottom: 0;
      color: #888;
      text-align: center;
    }

    .btn-redirect {
      margin: 34px auto 0 auto;
      padding: 15px 52px;
      background: #AC0707;
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 3px 16px #ac070745;
      font-weight: bold;
      letter-spacing: 2px;
      transition: background 0.18s;
      outline: none;
      display: block;
    }

    .btn-redirect:hover {
      background: #7b0505;
    }

    @media (max-width: 540px) {
      .svg-box {
        width: 98vw;
        height: 36vw;
        min-height: 140px;
      }

      h1 {
        font-size: 22px;
      }

      .desc {
        font-size: 12px;
      }

      .btn-redirect {
        font-size: 14px;
        padding: 10px 16vw;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="svg-box">
      <svg width="156" height="146" viewBox="0 0 156 146" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Streamlined motion lines -->
        <rect x="26" y="106" width="52" height="6" rx="3" fill="#AC0707" opacity="0.18" />
        <rect x="77" y="36" width="56" height="6" rx="3" fill="#AC0707" opacity="0.16" />
        <!-- Outer red glowing track -->
        <circle cx="78" cy="74" r="62" stroke="#AC0707" stroke-width="10" />
        <!-- Inner dark track -->
        <circle cx="78" cy="74" r="35" stroke="#3a3a3a" stroke-width="6" />
        <!-- Center hub -->
        <circle cx="78" cy="74" r="14" fill="#AC0707" stroke="#fff" stroke-width="3.2" />
        <!-- Grip bars -->
        <rect x="48" y="33" width="18" height="9" rx="4.5" fill="#fff" opacity="0.92" transform="rotate(-20 48 33)" />
        <rect x="98" y="28" width="18" height="9" rx="4.5" fill="#fff" opacity="0.92" transform="rotate(20 98 28)" />
        <!-- Car off track (top right, slightly rotated and outside circle) -->
        <g transform="translate(123,17) rotate(-25)">
          <!-- Car shadow -->
          <ellipse cx="0" cy="10" rx="10" ry="4" fill="#222" opacity="0.4" />
          <!-- Flipped car body -->
          <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#AC0707" stroke="#fff" stroke-width="1.8" />
          <!-- Car roof (glass) -->
          <rect x="-3" y="-6" width="9" height="8" rx="2.8" fill="#fff" opacity="0.7" />
          <!-- Rear spoiler/wings -->
          <rect x="-8" y="-3.5" width="3" height="7" rx="1.3" fill="#AC0707" opacity="0.7" stroke="#fff"
            stroke-width="0.7" />
          <rect x="5" y="-3.5" width="3" height="7" rx="1.3" fill="#AC0707" opacity="0.7" stroke="#fff"
            stroke-width="0.7" />
          <!-- Wheels (rotated for flipped/accident effect) -->
          <ellipse cx="-6" cy="-6" rx="1.7" ry="3.5" fill="#222" stroke="#fff" stroke-width="0.7" />
          <ellipse cx="6" cy="-6" rx="1.7" ry="3.5" fill="#222" stroke="#fff" stroke-width="0.7" />
          <ellipse cx="-6" cy="6" rx="1.7" ry="3.5" fill="#222" stroke="#fff" stroke-width="0.7" />
          <ellipse cx="6" cy="6" rx="1.7" ry="3.5" fill="#222" stroke="#fff" stroke-width="0.7" />
          <!-- Motion/star burst (crash symbols) -->
          <polygon points="0,13 1.2,17.5 -1.2,17.5" fill="#fff" opacity="0.3" />
          <polygon points="-8,-2 -12,-0.5 -11.3,-4.5" fill="#fff" opacity="0.22" />
        </g>
      </svg>
    </div>
    <h1>Off Track</h1>
    <div class="error-code" id="errorCode"></div>
    <div class="desc">Looks like this page is lagging behind your speed.</div>
    <div class="tip">Tap the red button to get back on track!</div>
    <button class="btn-redirect" onclick="handleRedirect()">Back on Track</button>
  </div>
  <script>
    // Show error code if present
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("error_code");
      if (code) {
        document.getElementById('errorCode').textContent = `Error Code: ${code}`;
      }
    })();

    function handleRedirect() {
      const params = new URLSearchParams(window.location.search);
      const redirectUrl = params.get("failed_url");
      if (redirectUrl) {
        window.location.href = redirectUrl;
      }
    }
  </script>
</body>

</html>
